<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant ChatBot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>🍽️ FoodPoint ChatBot</h1>
        <div id="chat-window">
            <div id="messages"></div>
        </div>

        <div id="controls">
            <input type="text" id="user_input" placeholder="Type your message here..." autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>

        <hr>
        <h3>Or use the API</h3>
        <pre>POST /api/chat  { "message": "Show me menu" }</pre>
    </div>

<script>
const messages = document.getElementById('messages');
const input = document.getElementById('user_input');
const sendBtn = document.getElementById('sendBtn');

function addMessage(cssClass, text) {
    const div = document.createElement('div');
    div.className = cssClass;
    div.innerHTML = text.replace(/\n/g, '<br>');
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

sendBtn.addEventListener('click', () => sendMessage());
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    addMessage('user', '<b>You:</b> ' + text);

    // Send to GUI endpoint
    const form = new FormData();
    form.append('user_message', text);

    fetch('/get', { method: 'POST', body: form })
    .then(res => res.text())
    .then(data => {
        addMessage('bot', '<b>Bot:</b> ' + data);
    })
    .catch(err => {
        addMessage('bot', '<b>Bot:</b> Error contacting server');
    });

    input.value = '';
}
</script>
</body>
</html>
