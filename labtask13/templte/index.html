<!DOCTYPE html>
<html>
<head>
    <title>Resume Analyzer – Flask NLP</title>

    <!-- BOOTSTRAP -->
    <link rel="stylesheet" 
     href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #2b5876, #4e4376);
            height: 100vh;
            color: white;
            padding-top: 40px;
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .btn-upload {
            background-color: #ffca28;
            border: none;
            color: #212121;
            font-weight: bold;
        }

        .result-box {
            background: rgba(0, 0, 0, 0.35);
            padding: 20px;
            border-radius: 10px;
        }

    </style>
</head>

<body>

<div class="container">
    <div class="col-md-6 mx-auto glass-box">

        <h2 class="text-center mb-4">📄 Resume Analyzer</h2>

        <form action="/analyze" method="POST" enctype="multipart/form-data">
            <input type="file" name="resume" class="form-control mb-3" required>

            <button class="btn btn-upload w-100">Analyze Resume</button>
        </form>

        {% if uploaded %}
        <hr>
        <h5>Uploaded File:</h5>
        <p>{{ uploaded }}</p>

        <h5>Extracted Skills:</h5>
        <div class="result-box">
            {% if found_skills %}
                {% for skill in found_skills %}
                    <span class="badge bg-warning text-dark">{{ skill }}</span>
                {% endfor %}
            {% else %}
                <p>No skills found.</p>
            {% endif %}
        </div>

        <h5 class="mt-3">Full Extracted Text:</h5>
        <div class="result-box">
            <pre style="white-space: pre-wrap; color: #ffeb3b;">{{ result_text }}</pre>
        </div>
        {% endif %}

    </div>
</div>

</body>
</html>
